name: Test

# Every push, including master and release tags. Pull requests come from
# branches in this repo, so their pushes already run these checks.
on:
  push:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - run: npm ci

      # The lint script passes --fix, so CI calls ESLint directly to fail instead
      - run: npx eslint .

      - run: npm run typecheck

  run_tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node_version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}

      - run: npm ci

      # pretest builds the CLI, and the tests run the built dist/index.js
      - run: npm test
