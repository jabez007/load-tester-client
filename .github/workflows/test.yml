name: Test

on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - run: npm ci

      # The lint script passes --fix, so CI calls ESLint directly to fail instead
      - run: npx eslint .

      - run: npm run typecheck

  run_tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node_version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}

      - run: npm ci

      # pretest builds the CLI, and the tests run the built dist/index.js
      - run: npm test
